    <script>
        // Note: The correct answer is placed at index 0 for every question. 
        // The startQuiz() function dynamically shuffles the options so the user sees a random order.
        const questions = [
           
  // ── 1. Introduction to Digital Forensics ──────────────────────────────────
  { q: "What is Digital Forensics?", options: ["The study of computer hardware design", "The science of identifying, collecting, preserving, and analyzing electronic data to investigate incidents, often in support of legal proceedings", "A type of network monitoring software", "The process of designing secure software"], a: 1, e: "Digital forensics is the science of identifying, collecting, preserving, and analyzing electronic data to investigate incidents, often in support of legal proceedings." },
 
  { q: "What is the primary goal of Digital Forensics?", options: ["To hack into criminal systems", "To reconstruct events, identify perpetrators, and present findings in a way that is admissible in court", "To develop new security software", "To monitor network traffic in real time"], a: 1, e: "The goal of digital forensics is to reconstruct events, identify perpetrators, and present findings in a way that is admissible in court." },
 
  { q: "Which step in digital forensics involves securely obtaining copies of data without altering original evidence?", options: ["Analysis", "Reporting", "Identification", "Acquisition"], a: 3, e: "Acquisition is the step where digital forensic investigators securely obtain copies of data from devices, often without altering the original evidence." },
 
  { q: "Which key area of Digital Forensics involves studying malicious software to understand attacks?", options: ["Network Forensics", "Mobile Device Forensics", "Malware Forensics", "Database Forensics"], a: 2, e: "Malware Forensics is the key area of digital forensics that involves studying malicious software to understand how attacks were carried out." },
 
  { q: "Which key area of Digital Forensics involves monitoring and analyzing network traffic for intrusions?", options: ["Computer Forensics", "Mobile Device Forensics", "Cloud Forensics", "Network Forensics"], a: 3, e: "Network Forensics involves monitoring and analyzing network traffic to detect and investigate intrusions or cyberattacks." },
 
  { q: "Which key area of Digital Forensics focuses on extraction of SMS, calls, and app data from phones and tablets?", options: ["Database Forensics", "Mobile Device Forensics", "Cloud Forensics", "Computer Forensics"], a: 1, e: "Mobile Device Forensics is the area that handles extraction of SMS, call logs, and app data from smartphones and tablets." },
 
  { q: "Which benefit of Digital Forensics relates to recovering lost or deleted data?", options: ["Solving crimes involving digital devices", "Protects organizations from cyberattacks", "Aids in recovering lost or deleted data", "Ensures legal compliance in evidence handling"], a: 2, e: "Aids in recovering lost or deleted data is one of the listed benefits of digital forensics — useful in disaster recovery and investigations." },
 
  { q: "Corporate Investigations is a key application of Digital Forensics used for:", options: ["Investigating physical murder scenes", "Rebuilding activities of employees, investigating policy violations, and responding to data breaches", "Developing mobile applications", "Monitoring satellite communications"], a: 1, e: "Corporate Investigations is a Digital Forensics application used for rebuilding employee activities, investigating internal policy violations, and responding to data breaches." },
 
  // ── 2. Rules of Digital Forensics ─────────────────────────────────────────
  { q: "What does 'Admissibility' mean in the context of digital forensics rules?", options: ["The evidence must be encrypted", "The evidence must be legally usable in formal proceedings", "The evidence must be stored on a cloud server", "The evidence must be collected within 24 hours"], a: 1, e: "Admissibility means the digital evidence must be legally usable in formal legal proceedings — it must meet legal standards to be accepted in court." },
 
  { q: "Which digital forensics rule requires using write-blockers and hash functions (MD5, SHA-256) to verify data has not been modified?", options: ["Admissibility Rule", "Chain of Custody Rule", "Integrity Rule", "Completeness Rule"], a: 2, e: "The Integrity Rule states that data must remain untouched and unmodified. Write-blockers and hash functions (MD5, SHA-1, SHA-256) are used to verify that evidence integrity is maintained." },
 
  { q: "What is the Chain of Custody rule in Digital Forensics?", options: ["A record of every encryption key used", "A record of every person who has handled the evidence from collection to presentation", "The process of collecting data from devices", "The hash value of every piece of evidence"], a: 1, e: "Chain of Custody requires maintaining a complete record of every person who has handled the evidence — from collection to presentation — to ensure its credibility in court." },
 
  { q: "Which Digital Forensics rule states that the forensic process should be repeatable by another expert and yield the same results?", options: ["Legality Rule", "Documentation Rule", "Reliability Rule", "Reproducibility Rule"], a: 3, e: "The Reproducibility Rule states that the forensic process should be repeatable by another expert and yield the same results, ensuring fairness and reliability." },
 
  { q: "The 'Minimal Handling Rule' in digital forensics means:", options: ["Only one investigator handles evidence", "Digital evidence should be handled as little as possible to reduce chances of accidental modification or corruption", "Evidence must be stored minimally in small files", "Investigators should take minimal notes"], a: 1, e: "The Minimal Handling Rule states that digital evidence should be handled as little as possible to reduce the chances of accidental modification or corruption." },
 
  { q: "The 'Legality Rule' in Digital Forensics requires investigators to:", options: ["Use only open-source forensic tools", "Follow laws and regulations such as privacy laws and search warrants; unauthorized collection is not valid", "Complete the investigation within a legal time limit", "Present evidence only to legal teams"], a: 1, e: "The Legality Rule states that investigators must follow laws and regulations (like privacy laws and search warrants). Unauthorized access or evidence collection is not valid in court." },
 
  { q: "Which Digital Forensics rule states that evidence should present the entire relevant story, not just fragments?", options: ["Authenticity Rule", "Reliability Rule", "Completeness Rule", "Reproducibility Rule"], a: 2, e: "The Completeness Rule states that evidence should present the entire relevant story, not just selected fragments, to ensure a full and fair account is presented." },
 
  // ── 3. Digital Forensics Investigation Process ────────────────────────────
  { q: "What is the first step in the Digital Forensics Investigation Process?", options: ["Preservation", "Collection", "Identification", "Analysis"], a: 2, e: "Identification is the first step — recognizing potential digital evidence sources such as computers, mobile phones, cloud accounts, storage devices, and logs." },
 
  { q: "Which step in the Digital Forensics Investigation Process involves creating forensic images and using write-blockers?", options: ["Identification", "Examination", "Analysis", "Preservation"], a: 3, e: "Preservation involves protecting evidence from tampering or alteration using techniques like creating forensic images and using write-blockers to secure devices." },
 
  { q: "FTK, EnCase, and Autopsy are forensic tools used in which step of the investigation process?", options: ["Presentation", "Analysis", "Collection", "Documentation"], a: 2, e: "FTK (Forensic Toolkit), EnCase, and Autopsy are specialized forensic tools used in the Collection step to acquire evidence in a legally approved manner." },
 
  { q: "Which investigation step involves searching for relevant information using keyword searches and metadata analysis?", options: ["Collection", "Preservation", "Examination", "Presentation"], a: 2, e: "Examination involves searching for relevant information using filtering, keyword searches, and metadata analysis to extract deleted files, hidden data, logs, and encrypted information." },
 
  { q: "The Analysis step in Digital Forensics Investigation involves:", options: ["Gathering physical devices", "Reconstructing digital events (who, what, when, where, how) and correlating findings with case requirements", "Presenting findings in court", "Maintaining chain of custody records"], a: 1, e: "Analysis involves reconstructing digital events (who, what, when, where, how), correlating findings with case requirements, and using forensic techniques to detect hacking, fraud, malware, or insider threats." },
 
  { q: "Which step in the Digital Forensics Investigation Process involves documenting detailed notes, screenshots, logs, and forensic reports?", options: ["Examination", "Analysis", "Presentation", "Documentation"], a: 3, e: "Documentation involves recording every step taken during the investigation and maintaining detailed notes, screenshots, logs, and forensic reports." },
 
  { q: "When handling digital evidence, investigators should always work on:", options: ["The original data directly", "Copies, not the original data, to preserve integrity", "Encrypted backups only", "Cloud-synced versions"], a: 1, e: "A key principle of digital evidence handling is to always work on copies, not the original data, to preserve the integrity of the evidence using hashing techniques like MD5 or SHA-256." },
 
  // ── 4. Models of Digital Forensic Investigation ───────────────────────────
  { q: "When was the DFRWS (Digital Forensic Research Workshop) Model proposed?", options: ["1995", "2001", "2005", "2010"], a: 1, e: "The DFRWS Model was proposed in 2001 at the Digital Forensic Research Workshop, providing a systematic framework for forensic investigations." },
 
  { q: "Which phase is unique to the DFRWS Model and involves putting digital events together to build a timeline of what occurred?", options: ["Documentation", "Presentation", "Reconstruction", "Examination"], a: 2, e: "Reconstruction is a unique phase of the DFRWS Model — it involves putting together digital events based on analyzed evidence to build a narrative or timeline of what occurred." },
 
  { q: "The DFRWS Model is widely used in:", options: ["Software development", "Law enforcement and cybercrime cases", "Network configuration", "Hardware manufacturing"], a: 1, e: "The DFRWS Model is widely used in law enforcement and cybercrime cases, providing a systematic and structured framework for forensic investigations." },
 
  { q: "The Abstract Digital Forensics Model (ADFM) was developed by:", options: ["Carrier and Spafford (2003)", "Stephenson (2003)", "Reith, Carr, & Gunsch (2002)", "DFRWS Committee (2001)"], a: 2, e: "The ADFM was developed by Reith, Carr, & Gunsch in 2002 to provide a structured and systematic approach for handling digital forensic investigations." },
 
  { q: "Which additional phases does ADFM add compared to the DFRWS Model, making it more comprehensive?", options: ["Reconstruction and Corroboration", "Preparation, Approach Strategy, and Returning Evidence", "Event Normalization and De-confliction", "Readiness and Review"], a: 1, e: "ADFM adds Preparation, Approach Strategy, and Returning Evidence phases — addressing gaps in earlier models like DFRWS and making it more legally robust." },
 
  { q: "The Approach Strategy phase in ADFM is used to:", options: ["Return evidence to its owner", "Define the strategy to maximize collection of relevant data while minimizing disruption", "Prepare legal documents only", "Examine collected evidence in detail"], a: 1, e: "Approach Strategy in ADFM is used to define the investigation strategy that maximizes collection of relevant data while minimizing disruption to the system or organization." },
 
  { q: "The IDIP (Integrated Digital Investigation Process) Model was proposed by:", options: ["Reith, Carr, & Gunsch", "Stephenson", "DFRWS Committee", "Carrier and Spafford (2003)"], a: 3, e: "The IDIP Model was proposed by Carrier and Spafford in 2003 to provide a high-level, systematic, and iterative framework integrating digital evidence handling with traditional physical crime investigations." },
 
  { q: "Which phase of the IDIP Model focuses on detecting an incident and obtaining authorization to proceed with the investigation?", options: ["Readiness", "Deployment", "Physical Crime Scene Investigation", "Review"], a: 1, e: "Deployment in the IDIP Model involves detecting and notifying relevant parties about an incident and obtaining necessary authorization to proceed with the investigation." },
 
  { q: "The Review phase of the IDIP Model involves:", options: ["Collecting digital evidence", "Reviewing the entire investigation, identifying areas for improvement, and building a mechanism for more efficient future forensic examinations", "Presenting findings in court", "Obtaining search warrants"], a: 1, e: "The Review phase in IDIP involves reviewing the entire investigation, identifying areas for improvement, and building a mechanism for more efficient future forensic examinations." },
 
  { q: "The EEDIP (End-to-End Digital Investigation Process) Model was developed by:", options: ["Reith, Carr, & Gunsch", "Carrier and Spafford", "DFRWS Committee", "Stephenson (2003)"], a: 3, e: "The EEDIP Model was developed by Stephenson in 2003, focusing on creating a complete picture of a digital incident by examining evidence from its source, through the network, to its destination." },
 
  { q: "What is the core principle of 'Source-to-Destination Focus' in the EEDIP Model?", options: ["Evidence must be stored at the source only", "Every digital incident has a source, a destination, and a path between them which the investigation must trace", "All evidence is collected from the destination only", "Evidence is transferred directly to the court"], a: 1, e: "Source-to-Destination Focus in EEDIP operates on the premise that every digital incident has a source, a destination, and a path — and the investigation must trace this complete path." },
 
  { q: "Which EEDIP phase involves standardizing different data formats and events for better comparison and analysis?", options: ["Preliminary Correlation", "Second Level Correlation", "Event Normalization", "Timeline Analysis"], a: 2, e: "Event Normalization in EEDIP involves standardizing different data formats and events to allow for better comparison and analysis across the investigation." },
 
  { q: "The EMCI (Extended Model of Cybercrime Investigation) was specifically designed to address:", options: ["Simple computer theft cases only", "The complexity of cybercrimes involving physical and digital evidence, multiple jurisdictions, and sophisticated offenders", "Network configuration issues", "Hardware forensics only"], a: 1, e: "The EMCI was designed to address the complexity of cybercrimes — which often involve both physical and digital evidence, multiple jurisdictions, and sophisticated offenders." },
 
  { q: "Which phase is added in the EMCI model compared to basic forensic models?", options: ["Reconstruction", "Event Normalization", "Examination/Authentication — verifying integrity and authenticity of collected data", "Deployment"], a: 2, e: "Examination/Authentication is a phase in EMCI that involves inspecting and verifying the integrity and authenticity of collected data, ensuring it hasn't been altered." },
 
  { q: "In UML modeling of digital forensic processes, Activity Diagrams are used to:", options: ["Show physical hardware components", "Model the lifecycle of digital evidence", "Map out step-by-step activities from identifying evidence to reporting findings, showing decision points and logical flow", "Illustrate interactions between actors and the forensic system"], a: 2, e: "Activity Diagrams in UML map out the step-by-step activities in the forensic process — from identifying evidence to reporting findings — showing decision points and logical flow." },
 
  { q: "Which UML diagram models the different states of digital evidence as it moves through the forensic investigation?", options: ["Activity Diagrams", "Use Case Diagrams", "Deployment Diagrams", "Statechart Diagrams"], a: 3, e: "Statechart Diagrams model the different states of digital evidence as it moves through the forensic investigation, such as from 'preserved' to 'analyzed'." },
 
  { q: "Which benefit of UML in digital forensics refers to revealing limitations and areas for improvement in existing models?", options: ["Improved Communication", "Structured Approach", "Identifying Gaps and Shortcomings", "Foundation for Development"], a: 2, e: "Identifying Gaps and Shortcomings is a benefit of UML in digital forensics — the process of modeling can reveal limitations and areas for improvement within existing digital forensic process models." },
 
  // ── 5. Ethical Hacking ────────────────────────────────────────────────────
  { q: "What is Ethical Hacking?", options: ["Illegal access to government systems", "The authorized practice of using hacking techniques to find and fix security vulnerabilities in computer systems, networks, and applications", "Hacking done anonymously for social causes", "Hacking performed by government agencies only"], a: 1, e: "Ethical hacking is the authorized practice of using hacking techniques to find and fix security vulnerabilities in computer systems, networks, and applications — acting as the opposite of a malicious hacker to improve cybersecurity." },
 
  { q: "Ethical hackers are also known as:", options: ["Black hat hackers", "Script kiddies", "White hat hackers or penetration testers", "Gray hat hackers"], a: 2, e: "Ethical hackers are also known as 'white hat hackers' or 'penetration testers' — they work with permission from system owners to identify and fix vulnerabilities proactively." },
 
  { q: "Which role of an Ethical Hacker involves simulating real-world cyberattacks to test an organization's defenses?", options: ["Ensure Compliance only", "Simulate Attacks", "Maintain log records", "Design firewalls"], a: 1, e: "Simulate Attacks is a key role of an ethical hacker — they simulate real-world cyberattacks to test the effectiveness of an organization's defenses." },
 
  { q: "Which type of hacker exploits vulnerabilities for illegal or harmful purposes such as data theft or financial gain?", options: ["White Hat Hacker", "Blue Hat Hacker", "Black Hat Hacker", "Red Hat Hacker"], a: 2, e: "Black Hat Hackers are malicious cybercriminals who exploit vulnerabilities in systems for illegal or harmful purposes such as data theft, financial gain, or disruption." },
 
  { q: "Gray Hat Hackers are best described as:", options: ["Novice hackers who use pre-written scripts", "Hackers employed by governments for cyber warfare", "Hackers who may discover vulnerabilities without authorization but without malicious intent, operating in a morally ambiguous zone", "Hackers who target and disable black hat hackers"], a: 2, e: "Gray Hat Hackers operate in a morally ambiguous zone — they may discover vulnerabilities without authorization but without malicious intent, and may report the issues sometimes demanding a fee." },
 
  { q: "Which type of hacker actively targets and disables black hat hackers and their malicious networks?", options: ["Gray Hat Hacker", "Green Hat Hacker", "Blue Hat Hacker", "Red Hat Hacker"], a: 3, e: "Red Hat Hackers are like vigilantes who actively target and disable black hat hackers and their malicious networks." },
 
  { q: "Hacktivists are hackers who:", options: ["Work for governments to conduct cyber espionage", "Use hacking skills to advance a political or social agenda by disrupting websites or stealing sensitive information", "Test applications before launch for companies", "Are novice hackers who use pre-written scripts"], a: 1, e: "Hacktivists use their hacking skills to advance a political or social agenda — disrupting websites or stealing sensitive information to promote their cause." },
 
  { q: "Blue Hat Hackers are typically:", options: ["State-sponsored hackers", "Security experts hired by companies to find vulnerabilities before a system is launched", "Novice hackers learning techniques", "Hacktivists with political motives"], a: 1, e: "Blue Hat Hackers are often security experts hired by companies to find vulnerabilities before a system is officially launched, similar to a final security check." },
 
  { q: "Script Kiddies are described as:", options: ["Advanced ethical hackers", "State-sponsored cyber warriors", "Amateur hackers who use pre-written scripts and tools created by others, lacking deep technical knowledge", "Hackers who target social media platforms"], a: 2, e: "Script Kiddies are amateur hackers who use pre-written scripts and tools created by others to carry out attacks — they lack deep technical knowledge themselves." },
 
  // ── 6. Types of Hacking – Network Hacking ─────────────────────────────────
  { q: "How does AI enhance phishing attacks compared to traditional phishing?", options: ["AI makes phishing emails shorter", "AI uses hyper-personalization, sophisticated language models, and multi-channel deception to create highly convincing, personalized, and error-free attacks", "AI only targets mobile users", "AI sends phishing emails faster without any customization"], a: 1, e: "AI enhances phishing by analyzing public data to craft hyper-personalized messages, using language models to produce grammatically perfect copy, and extending attacks across multiple channels — making them much harder to detect." },
 
  { q: "Which characteristic makes AI-powered phishing emails harder to detect than traditional ones?", options: ["They are sent in bulk", "They contain obvious grammar errors", "They reference specific personal details about the target such as job role or hobbies, making the email feel legitimate", "They are always sent from known email addresses"], a: 2, e: "AI-powered phishing emails feel legitimate because they reference specific personal details about the target (job role, internal company info, personal hobbies), removing the obvious signs of a traditional phishing attempt." },
 
  { q: "What does 'Double Extortion' mean in Ransomware 2.0?", options: ["Attackers demand ransom twice from the same victim", "Attackers both encrypt files AND steal sensitive data, threatening to publicly release it if ransom isn't paid", "Attackers use two different types of ransomware simultaneously", "Attackers target two different organizations at once"], a: 1, e: "Double Extortion in Ransomware 2.0 means attackers don't just encrypt files — they steal sensitive data first, then threaten to publicly release it if the ransom isn't paid, creating a dual incentive to pay." },
 
  { q: "RaaS in the context of Ransomware 2.0 stands for:", options: ["Remote Access as a Service", "Ransomware as a Service", "Recovery as a Service", "Risk Assessment as a Service"], a: 1, e: "RaaS (Ransomware-as-a-Service) is a model in Ransomware 2.0 where groups like LockBit 2.0 make it easier for affiliates to deploy ransomware and manage attacks." },
 
  { q: "Which defense strategy against Ransomware 2.0 involves maintaining multiple, isolated, and off-site copies of data?", options: ["Endpoint Protection", "Security Awareness Training", "Vulnerability Management", "Robust Backup Strategies"], a: 3, e: "Robust Backup Strategies — maintaining multiple, isolated, and off-site backups of data scanned for malware before restoration — is a key defense against Ransomware 2.0." },
 
  { q: "Which common IoT vulnerability allows attackers to gain unauthorized access using factory-set credentials?", options: ["Insecure Data Transmission", "Lack of Network Segmentation", "Weak/Default Passwords", "Physical Tampering"], a: 2, e: "Weak/Default Passwords is a common IoT vulnerability — many devices ship with easily guessable default passwords that attackers can exploit to gain unauthorized access." },
 
  { q: "Botnets formed from hijacked IoT devices are primarily used for:", options: ["Improving network performance", "Launching Distributed Denial-of-Service (DDoS) attacks or distributing malware", "Providing cloud storage", "Encrypting user data for privacy"], a: 1, e: "Hijacked IoT devices are often used to form botnets for launching DDoS (Distributed Denial-of-Service) attacks or distributing malware across networks." },
 
  { q: "Which IoT mitigation strategy involves isolating IoT devices on separate networks from critical IT infrastructure?", options: ["Implement Strong Authentication", "Adopt a Zero-Trust Model", "Maintain Updated Firmware", "Segment Networks"], a: 3, e: "Network Segmentation (Segment Networks) involves isolating IoT devices on separate networks from critical IT infrastructure to limit the potential spread of an attack." },
 
  { q: "Deepfake technology is powered by which type of AI?", options: ["Supervised Learning only", "Expert Systems", "Generative AI using deep learning, particularly GANs (Generative Adversarial Networks)", "Reinforcement Learning only"], a: 2, e: "Deepfake technology uses Generative AI powered by deep learning — particularly GANs (Generative Adversarial Networks) — to create realistic but fake audio, video, and image content." },
 
  { q: "In a GAN used for deepfakes, what is the role of the Discriminator?", options: ["Creates new fake media", "Identifies fake media and provides feedback to help the generator improve its output over time", "Aligns audio with mouth movements", "Extracts features from images"], a: 1, e: "In GANs, the Discriminator learns to identify fake media and provides feedback to the Generator, which helps the Generator improve its output over time — in a continuous adversarial training process." },
 
  { q: "Which is a real-world risk of Deepfake technology misuse?", options: ["Improving voice assistant accuracy", "Creating interactive educational experiences", "Creating convincing fake news and propaganda that can influence public opinion and elections", "Digitally restoring old films"], a: 2, e: "Misinformation and Disinformation is a key risk of deepfake misuse — deepfakes can create convincing fake news and propaganda which can influence public opinion, elections, and incite civil unrest." },
 
  // ── 7. OS Hacking ─────────────────────────────────────────────────────────
  { q: "Which is the first stage of OS hacking where the attacker gathers information about the target?", options: ["Scanning", "Gaining Access", "Covering Tracks", "Reconnaissance"], a: 3, e: "Reconnaissance is the first stage of OS hacking — the attacker gathers as much information as possible about the target OS, its network, and its users using passive or active techniques." },
 
  { q: "Nmap is a tool commonly used in which stage of OS hacking?", options: ["Reconnaissance", "Gaining Access", "Maintaining Access", "Scanning"], a: 3, e: "Scanning is the stage where the hacker actively probes the system to identify open ports, discover vulnerabilities, and gather OS version details. Nmap is a commonly used tool for this purpose." },
 
  { q: "Which OS hacking technique involves the hacker ensuring continued access by installing backdoors or rootkits?", options: ["Reconnaissance", "Scanning", "Gaining Access", "Maintaining Access"], a: 3, e: "Maintaining Access is the stage where the hacker ensures continued access to the system by installing backdoors or malicious software like rootkits or Trojans that remain hidden from administrators." },
 
  { q: "Buffer Overflow in OS hacking works by:", options: ["Guessing user passwords using dictionaries", "Overloading a buffer in system memory to cause crashes or execute malicious code", "Deleting system logs to cover tracks", "Exploiting weak default passwords"], a: 1, e: "Buffer Overflow works by overloading a buffer in the system's memory, potentially causing the system to crash or allowing the attacker to execute malicious code and gain control." },
 
  { q: "An OS Downgrade Attack forces a system to:", options: ["Update to the latest version immediately", "Roll back to a previous, vulnerable version of the OS, bypassing modern security protections", "Install additional security patches", "Restart with factory settings"], a: 1, e: "An OS Downgrade Attack forces a fully patched system to roll back to a previous, vulnerable version of the OS — allowing attackers to exploit vulnerabilities that have long since been patched." },
 
  { q: "In an OS Downgrade Attack, what does the attacker compromise to disable the hypervisor's security functions?", options: ["The network firewall", "Virtualization-Based Security (VBS) by replacing its files with older vulnerable versions", "The antivirus software database", "The user account management system"], a: 1, e: "The attacker replaces files related to Virtualization-Based Security (VBS) with older, vulnerable versions — effectively disabling the hypervisor's security functions without turning off the feature." },
 
  { q: "Firmware-level exploits are particularly dangerous because:", options: ["They target only mobile devices", "Malware resides below the operating system, making it harder to detect and remove, and can persist even after OS reinstallation", "They only affect network routers", "They require physical access at all times"], a: 1, e: "Firmware-level exploits are dangerous because the malware resides below the operating system and traditional antivirus software — often persisting even after the OS is reinstalled or the device is rebooted." },
 
  { q: "Which type of firmware exploit installs malware to turn a device into part of a botnet or perform ransomware attacks?", options: ["Data Theft", "Device Manipulation", "Backdoors", "Malware Infection"], a: 3, e: "Malware Infection is a type of firmware exploit where malware is installed to turn a device into part of a botnet or to perform ransomware attacks." },

  { q: "What is a Zero-Day Vulnerability?", options: ["A vulnerability discovered exactly one day after a patch is released", "A software or hardware flaw that is unknown to the vendor and the public, with no patch available", "A vulnerability in zero-knowledge cryptography", "A flaw that only affects systems on the first day of operation"], a: 1, e: "A zero-day vulnerability is a software or hardware flaw that is unknown to the vendor and the public — called 'zero-day' because defenders have zero days to prepare or patch before attackers may use it." },
 
  { q: "Why are Zero-Day Exploits particularly dangerous?", options: ["They are easy to detect using standard antivirus software", "There are no ready defenses or patches available, making them difficult to detect and stop", "They only affect outdated software", "They can only be used once"], a: 1, e: "Zero-Day Exploits are particularly dangerous because there are no ready defenses or patches available at the time of exploitation, making them difficult to detect and stop." },

  { q: "Section 354C IPC under the CCPWC framework deals with:", options: ["Cyberstalking", "Identity theft", "Voyeurism — capturing or sharing intimate images/videos without consent", "Publishing obscene content online"], a: 2, e: "Section 354C IPC covers Voyeurism — capturing or sharing intimate images/videos without consent — and is a key legal provision under the CCPWC Scheme." },
 
        ];

        let currentIdx = 0, score = 0, answered = false;

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            const totalQuestions = questions.length;
            document.getElementById('progress-text').innerText = `Question 1/${totalQuestions}`;
            document.getElementById('final-total').innerText = `Correct out of ${totalQuestions}`;
            
            // Randomize options for each question initially
            questions.forEach(q => {
                const originalCorrect = q.options[q.a];
                
                // Fisher-Yates shuffle for options
                for (let i = q.options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
                }
                
                // Find new index of the correct answer
                q.a = q.options.indexOf(originalCorrect);
            });

            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            const totalQuestions = questions.length;
            
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('progress-text').innerText = `Question ${currentIdx + 1}/${totalQuestions}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / totalQuestions) * 100}%`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-emerald-200 hover:bg-emerald-50 font-medium text-sm text-slate-700 transition-all";
                btn.innerText = opt;
                btn.onclick = () => selectOption(i, btn);
                container.appendChild(btn);
            });
            
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            answered = false;
        }

        function selectOption(idx, btn) {
            if (answered) return;
            answered = true;
            
            const q = questions[currentIdx];
            const allBtns = document.querySelectorAll('#options-container button');
            
            if (idx === q.a) {
                score++;
                btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                document.getElementById('score-text').innerText = `Score: ${score}`;
            } else {
                btn.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                allBtns[q.a].classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
            }
            
            const exp = document.getElementById('explanation-box');
            exp.innerHTML = `<strong>Explanation:</strong> ${q.e}`;
            exp.classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
            }
        }
    </script>
