</head>
<body class="bg-slate-50 min-h-screen">
    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col p-4">
        <!-- Start Screen -->
        <div id="start-screen" class="flex-1 flex flex-col justify-center items-center text-center">
            <div class="w-24 h-24 bg-emerald-100 rounded-3xl flex items-center justify-center mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Unit 5 Quiz</h1>

            <button onclick="startQuiz()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-bold text-lg shadow-lg hover:bg-emerald-700 mb-4 transition-colors">Start Solving</button>

    </div>

    <script>
        // Note: The correct answer is placed at index 0 for every question. 
        // The startQuiz() function dynamically shuffles the options so the user sees a random order.
        const questions = [
            // 1-30: Fundamentals of AR, VR, MR, XR
            { q: "What does the term 'XR' stand for?", options: ["Extended Reality", "Extra Reality", "External Reality", "Extreme Reality"], a: 0, e: "XR (Extended Reality) is the umbrella term for VR, AR, and MR." },
            { q: "Which technology completely replaces the user's real-world environment with a simulated one?", options: ["Virtual Reality (VR)", "Augmented Reality (AR)", "Mixed Reality (MR)", "Assisted Reality"], a: 0, e: "VR uses headsets to block out the physical world and immerse the user in a digital environment." },
            { q: "Which technology simply overlays digital information onto the real-world view without deep interaction?", options: ["Augmented Reality (AR)", "Mixed Reality (MR)", "Virtual Reality (VR)", "Cinematic VR"], a: 0, e: "AR adds digital elements to a live view, usually via a smartphone camera." },
            { q: "In which technology do digital and physical objects co-exist and interact in real-time?", options: ["Mixed Reality (MR)", "Virtual Reality (VR)", "3D Video", "Augmented Reality (AR)"], a: 0, e: "MR merges real and virtual worlds, allowing physical and digital objects to interact." },
            { q: "What describes the feeling of 'being there' in a virtual environment?", options: ["Presence", "Latency", "Tracking", "Rendering"], a: 0, e: "Presence is the psychological sensation of actually existing inside the virtual space." },
            { q: "What does 'Immersion' refer to in VR?", options: ["The objective level of sensory fidelity provided by the system", "The physical hardware used", "The speed of the internet connection", "The subjective feeling of the user"], a: 0, e: "Immersion is the technical capability of the system to deliver realistic sensory inputs." },
            { q: "Pokémon GO is the most famous mainstream example of which technology?", options: ["Augmented Reality (AR)", "Virtual Reality (VR)", "Mixed Reality (MR)", "Holographic Projection"], a: 0, e: "Pokémon GO overlays digital creatures onto the real world using the phone's camera." },
            { q: "Who introduced the 'Reality-Virtuality Continuum'?", options: ["Paul Milgram", "Satoshi Nakamoto", "Mark Zuckerberg", "Palmer Luckey"], a: 0, e: "Paul Milgram defined the continuum scaling from completely real to completely virtual environments." },
            { q: "Where does Augmented Reality sit on Milgram’s Reality-Virtuality Continuum?", options: ["Closer to the real environment", "At the extreme virtual end", "Exactly in the middle", "Outside the continuum"], a: 0, e: "AR is closer to reality because the primary view is the physical world." },
            { q: "Where does Augmented Virtuality (AV) sit on the Continuum?", options: ["Closer to the virtual environment", "Closer to the real environment", "At the extreme real end", "Outside the continuum"], a: 0, e: "AV is primarily virtual but integrates real-world objects into the digital space." },
            { q: "What does 'FOV' stand for in immersive tech?", options: ["Field of View", "Frequency of Vision", "Focus on Vectors", "Frame of Verification"], a: 0, e: "Field of View (FOV) refers to the extent of the observable world seen at any moment." },
            { q: "Why is a wider Field of View (FOV) preferred in VR?", options: ["It creates a greater sense of immersion by engaging peripheral vision", "It prevents motion sickness completely", "It lowers the processing power required", "It reduces the weight of the headset"], a: 0, e: "A wide FOV mimics human vision, tricking the brain into feeling immersed." },
            { q: "What is 'Latency' in VR?", options: ["The delay between a user's physical movement and the visual update on the screen", "The battery life of the device", "The time it takes to download a VR app", "The resolution of the display"], a: 0, e: "High latency causes visual lag, which is the primary cause of VR motion sickness." },
            { q: "What is the recommended maximum latency (motion-to-photon) for a comfortable VR experience?", options: ["20 milliseconds", "100 milliseconds", "500 milliseconds", "1 second"], a: 0, e: "Latency must be under 20ms to prevent the brain from noticing the delay and getting nauseous." },
            { q: "What does an 'HMD' refer to?", options: ["Head-Mounted Display", "Holographic Motion Detector", "Hardware Mapping Device", "Haptic Movement Dynamics"], a: 0, e: "An HMD is the physical headset worn by the user in VR or MR." },
            { q: "What is 'Stereoscopy'?", options: ["Displaying a slightly different image to each eye to create depth perception", "Recording audio from 360 degrees", "Tracking hand movements", "Increasing the frame rate"], a: 0, e: "Stereoscopy mimics human binocular vision to create a 3D effect from 2D screens." },
            { q: "Non-immersive VR is best described as:", options: ["Interacting with a 3D environment through a standard 2D flat monitor", "Using a VR headset without sound", "A fully enclosed sensory experience", "AR technology on a phone"], a: 0, e: "Non-immersive VR (like playing a 3D PC game) lacks the sensory enclosure of a headset." },
            { q: "Semi-immersive VR is commonly used for:", options: ["Flight simulators with physical cockpits and large projector screens", "Smartphone gaming", "Text-based coding", "Listening to podcasts"], a: 0, e: "Semi-immersive systems combine physical props with immersive screens, common in high-end training." },
            { q: "Fully-immersive VR requires which of the following?", options: ["A Head-Mounted Display (HMD) that blocks out the real world", "A standard laptop", "A physical cockpit", "A mobile phone camera"], a: 0, e: "Full immersion requires visual and auditory isolation from the physical environment." },
            { q: "What is the 'Refresh Rate' of a VR display?", options: ["How many times per second the display updates the image (measured in Hz)", "How fast the battery charges", "The speed of the internet connection", "The volume of the spatial audio"], a: 0, e: "High refresh rates (90Hz+) are essential to prevent visual stutter and motion sickness." },
            { q: "What is 'IPD'?", options: ["Inter-Pupillary Distance", "Internet Protocol Data", "Internal Processing Display", "Image Pixel Density"], a: 0, e: "IPD is the distance between your pupils. Adjusting the headset to match your IPD prevents eye strain." },
            { q: "What happens if a VR headset's IPD is set incorrectly?", options: ["The image appears blurry and causes visual fatigue", "The battery drains faster", "The sound stops working", "The controllers disconnect"], a: 0, e: "Incorrect IPD means you aren't looking through the 'sweet spot' of the lenses." },
            { q: "Which mapping technique translates physical walking into virtual walking?", options: ["Room-scale tracking", "Teleportation", "Joystick locomotion", "Static routing"], a: 0, e: "Room-scale allows the system to map a physical space so the user can physically walk around inside the game." },
            { q: "What is 'Teleportation' in VR locomotion?", options: ["Pointing to a location and instantly jumping there to prevent motion sickness", "Walking physically in a room", "Moving continuously using a joystick", "Running on a treadmill"], a: 0, e: "Teleportation bypasses the inner ear's motion detection, making it the most comfortable way to move in VR." },
            { q: "What is an omnidirectional treadmill used for?", options: ["Allowing a user to physically walk or run in any direction while staying in one place", "Charging the headset", "Tracking eye movements", "Improving Wi-Fi signals"], a: 0, e: "These treadmills solve the physical space limitation, allowing infinite virtual movement." },
            { q: "What is 'Cybersickness'?", options: ["Motion sickness caused by a mismatch between visual motion and physical motion in VR", "A virus on a computer", "Eye strain from blue light", "A fear of technology"], a: 0, e: "Cybersickness occurs when your eyes tell your brain you are moving, but your inner ear feels no movement." },
            { q: "What does 'Vergence-Accommodation Conflict' (VAC) cause?", options: ["Eye strain because eyes focus on a fixed screen distance but converge on objects appearing far away", "The headset to turn off", "Audio delay", "Controller tracking loss"], a: 0, e: "VAC is a primary biological challenge in stereoscopic displays causing visual fatigue." },
            { q: "What does the 'Screen Door Effect' (SDE) look like?", options: ["Visible unlit spaces between pixels, looking like a mesh screen", "The screen goes completely black", "Colors appear washed out", "Virtual objects clipping through walls"], a: 0, e: "SDE was common in early low-resolution headsets where the grid of pixels was easily visible." },
            { q: "How do manufacturers eliminate the Screen Door Effect?", options: ["By significantly increasing the display resolution (pixel density)", "By making screens smaller", "By turning off the brightness", "By using better audio"], a: 0, e: "Higher resolution displays pack pixels so closely together that the gaps disappear." },
            { q: "What is 'Asynchronous SpaceWarp' (ASW)?", options: ["A technique that generates synthetic frames when the PC drops frames, preventing stutter", "A sci-fi game feature", "A way to warp physical space", "A type of VR lens"], a: 0, e: "ASW artificially keeps the visual experience smooth even if the hardware struggles to hit 90 FPS." },

            // 31-60: Tracking, DoF, and Spatial Mapping
            { q: "What does 'DoF' stand for?", options: ["Degrees of Freedom", "Depth of Field", "Direction of Force", "Data of Frames"], a: 0, e: "DoF refers to the number of ways a rigid object can move through 3D space." },
            { q: "How many Degrees of Freedom (DoF) are required to track both rotation and physical position?", options: ["6 DoF", "3 DoF", "2 DoF", "9 DoF"], a: 0, e: "6 DoF tracks rotation (pitch, yaw, roll) and position (up/down, left/right, forward/backward)." },
            { q: "A VR headset that only tracks where you look (Pitch, Yaw, Roll) is classified as:", options: ["3 DoF", "6 DoF", "0 DoF", "Full DoF"], a: 0, e: "3 DoF only tracks rotational movements from a fixed point (e.g., Google Cardboard)." },
            { q: "If you can physically duck to avoid a virtual laser, your headset supports:", options: ["6 DoF", "3 DoF", "2 DoF", "1 DoF"], a: 0, e: "Ducking requires positional tracking along the Y-axis, which necessitates 6 DoF." },
            { q: "What is an IMU?", options: ["Inertial Measurement Unit", "Internal Measurement Unit", "Image Mapping Utility", "Integrated Motion Unit"], a: 0, e: "The IMU combines a gyroscope, accelerometer, and magnetometer to track basic movements." },
            { q: "Which sensor detects the rotational motion of a headset?", options: ["Gyroscope", "Thermometer", "Barometer", "Proximity sensor"], a: 0, e: "Gyroscopes detect rotational movements (pitch, yaw, roll)." },
            { q: "Which sensor detects linear acceleration (speeding up or slowing down)?", options: ["Accelerometer", "Magnetometer", "Camera", "GPS"], a: 0, e: "Accelerometers detect changes in velocity and physical movement." },
            { q: "What does 'Inside-Out Tracking' mean?", options: ["Cameras built into the headset look outward to map the room and track position", "Cameras placed around the room track the headset", "Tracking the inside of the user's eyes", "Tracking done outdoors"], a: 0, e: "Inside-out tracking requires no external sensors; the headset figures out its own position." },
            { q: "What does 'Outside-In Tracking' mean?", options: ["External sensors or cameras placed in the room tracking the headset's position", "Cameras on the headset looking out", "Tracking the weather outside", "Using GPS only"], a: 0, e: "Outside-in tracking uses external emitters/sensors looking inward at the user (like HTC Vive lighthouses)." },
            { q: "What is a major advantage of Inside-Out tracking?", options: ["It requires no setup of external sensors, making the system highly portable", "It is 100% flawless with no dead zones", "It requires a massive PC", "It only works in the dark"], a: 0, e: "Headsets like the Meta Quest use inside-out tracking so users can play anywhere." },
            { q: "Which tracking system suffers most from 'Occlusion' (e.g., losing controller tracking behind the back)?", options: ["Inside-out tracking (Camera-based)", "Outside-in tracking", "Magnetic tracking", "GPS tracking"], a: 0, e: "If the headset's cameras can't see the controllers behind your back, tracking is temporarily lost." },
            { q: "What do 'Base Stations' or 'Lighthouses' do?", options: ["Sweep the room with invisible lasers/IR light to track sensors on the headset", "Project Wi-Fi signals", "Provide power wirelessly", "Record audio"], a: 0, e: "Base stations act as external reference points for outside-in tracking systems." },
            { q: "What is SLAM?", options: ["Simultaneous Localization and Mapping", "Simulated Local Area Mapping", "System Log and Monitoring", "Spatial Location and Measurement"], a: 0, e: "SLAM is the algorithm that allows a device to map its environment and track its position within it simultaneously." },
            { q: "Why is SLAM critical for advanced AR?", options: ["It maps physical planes so AR objects sit on them naturally without floating away", "It lowers battery usage", "It translates languages", "It records audio"], a: 0, e: "SLAM understands the geometry of the room, enabling accurate placement of holograms." },
            { q: "What is 'Marker-based AR'?", options: ["AR that relies on scanning specific visual patterns (like QR codes) to trigger content", "AR that uses GPS", "AR that maps the room without images", "AR that projects light"], a: 0, e: "Marker-based AR requires a physical visual trigger for the camera to anchor content." },
            { q: "What is 'Markerless AR'?", options: ["AR that uses sensors to map the environment and place objects anywhere, without needing a specific image trigger", "AR that relies on barcodes", "AR that only works in VR", "AR that uses projectors"], a: 0, e: "Markerless AR uses SLAM to detect floors and walls dynamically." },
            { q: "Location-based AR relies primarily on which technology?", options: ["GPS, Compass, and Accelerometer", "Bluetooth only", "Infrared sensors", "QR Codes"], a: 0, e: "Location-based AR uses geographic coordinates to overlay information (e.g., Google Maps Live View)." },
            { q: "What is 'Projection-based AR'?", options: ["Projecting artificial light onto physical surfaces and sensing human interaction with it", "Snapchat face filters", "Pokémon GO", "GPS navigation"], a: 0, e: "This projects digital interfaces directly onto tables or walls without the user wearing glasses." },
            { q: "What does Superimposition AR do?", options: ["Partially or fully replaces the original view of a recognized object with an augmented view", "Creates a fully virtual room", "Projects holograms in mid-air", "Uses GPS to find locations"], a: 0, e: "Superimposition recognizes an object and overlays a model over it, like an X-ray view of a car engine." },
            { q: "Snapchat and Instagram face filters are examples of which AR technique?", options: ["Facial recognition and tracking AR", "Location-based AR", "Projection-based AR", "VR"], a: 0, e: "These apps track facial landmarks in real-time to anchor digital overlays." },
            { q: "What is 'Spatial Mapping'?", options: ["The process where an MR device creates a 3D geometric mesh of the physical environment", "Drawing a 2D map", "Finding your location on Google Maps", "Connecting to Wi-Fi"], a: 0, e: "Spatial mapping turns real-world couches and walls into a 3D digital mesh the software can interact with." },
            { q: "What is 'Environmental Understanding' in MR?", options: ["The headset identifying floors, walls, and tables to properly place holograms", "Knowing the weather outside", "Monitoring the user's mood", "Calculating the room temperature"], a: 0, e: "It allows digital objects to interact with physical barriers correctly." },
            { q: "What is a 'Spatial Anchor'?", options: ["A specific point in physical space where a hologram is permanently pinned", "A heavy weight attached to the headset", "A software bug", "A type of battery"], a: 0, e: "Spatial anchors allow digital objects to persist in the exact same physical location across sessions." },
            { q: "What is 'Light Estimation' in AR?", options: ["Matching the lighting and shadows of digital objects to the real-world environment", "Measuring battery life", "Turning on the phone's flashlight", "Calculating file sizes"], a: 0, e: "Light estimation makes AR objects look realistic by adapting to the physical room's lighting." },
            { q: "What is 'Occlusion' in advanced AR?", options: ["When physical objects block the view of digital objects behind them, adding realism", "Closing the app", "When the screen turns black", "A type of AR marker"], a: 0, e: "Occlusion ensures a digital pet walking behind a real sofa is hidden from view." },
            { q: "Which sensor is highly beneficial for perfect AR occlusion and depth mapping?", options: ["LiDAR scanner", "Microphone", "Thermometer", "Barometer"], a: 0, e: "LiDAR shoots lasers to map depth instantly and accurately." },
            { q: "What happens if AR registration fails?", options: ["Digital objects will appear to jitter, float, or slide away from their intended physical locations", "The app deletes itself", "The battery drains instantly", "The camera turns off"], a: 0, e: "Poor registration breaks the illusion of AR by failing to align virtual and real worlds." },
            { q: "What is 'Sensor Fusion'?", options: ["Combining data from multiple sensors (accelerometer, gyro, camera) to calculate a highly accurate position", "Melting sensors with heat", "Connecting two headsets", "A type of battery"], a: 0, e: "Fusing data eliminates the minor errors and drift present in individual sensors." },
            { q: "What happens if there is 'Drift' in a tracking system?", options: ["The virtual world slowly rotates or shifts away from the physical world alignment over time", "The user gets hot", "The controllers disconnect", "The screen turns blue"], a: 0, e: "Drift is an accumulation of small tracking errors that ruins positional accuracy." },
            { q: "What does 'Volumetric Capture' achieve?", options: ["Capturing a performance using multiple cameras to create a 3D hologram that can be viewed from any angle", "A flat photograph", "A voice recording", "A text document"], a: 0, e: "Volumetric video allows users to physically walk around a recorded person in AR/VR." },

            // 61-90: Hardware & Displays
            { q: "Which display technology is highly preferred in premium VR headsets for its deep blacks and fast response?", options: ["OLED / Micro-OLED", "LCD", "CRT", "E-ink"], a: 0, e: "OLED displays offer pure blacks and fast pixel switching, preventing blurring." },
            { q: "Why do VR headsets use specialized lenses?", options: ["To bend the light so the user's eyes can focus on a screen that is only an inch away", "To make the screen darker", "To protect the screen from scratching", "To record video"], a: 0, e: "Lenses warp the light to simulate distance; without them, the eye cannot focus so close." },
            { q: "What is a 'Fresnel Lens'?", options: ["A lightweight lens with concentric ridges that focuses light in a short distance", "A lens used to zoom in on distant objects", "A contact lens", "A camera lens"], a: 0, e: "Fresnel lenses allow headsets to be much thinner and lighter than traditional glass lenses." },
            { q: "What is the advantage of 'Pancake Lenses' over Fresnel lenses?", options: ["They fold light multiple times, allowing the headset to be significantly thinner and lighter", "They taste better", "They are cheaper to make", "They lower the resolution"], a: 0, e: "Pancake lenses drastically reduce the required distance between the screen and the lens." },
            { q: "What is the 'Sweet Spot' of a VR lens?", options: ["The center of the lens where the image is the sharpest and most clear", "A place to put your fingers", "The area where the battery is located", "The most comfortable part of the strap"], a: 0, e: "Adjusting your IPD puts your pupils directly in the sweet spot for maximum clarity." },
            { q: "What defines a 'Tethered' VR headset?", options: ["It must be physically connected to a powerful PC or console via a cable to process graphics", "It runs on AA batteries", "It connects to smartphones", "It requires no external hardware"], a: 0, e: "Tethered headsets rely on external computing power (e.g., Valve Index, PSVR2)." },
            { q: "What defines a 'Standalone' VR headset?", options: ["A wireless headset with all computing hardware, battery, and tracking built directly into the device", "A headset that needs a PC", "A phone placed in a cardboard box", "A pair of AR glasses"], a: 0, e: "Standalone headsets (e.g., Meta Quest) are all-in-one portable devices." },
            { q: "What is the primary display method for Smart Glasses like Google Glass?", options: ["Heads-Up Display (HUD) using a small prism", "Large VR screens", "Holographic projections", "Mobile phone screens"], a: 0, e: "Smart glasses reflect a simple digital screen into the user's peripheral vision via a HUD." },
            { q: "Which headset is widely considered the pioneer of standalone Mixed Reality?", options: ["Microsoft HoloLens", "Oculus Rift", "Google Cardboard", "Sony PlayStation VR"], a: 0, e: "HoloLens was the first major standalone holographic MR computer." },
            { q: "What is the primary focus of Apple's Vision Pro headset?", options: ["Spatial Computing with seamless integration of iOS apps and high-fidelity passthrough MR", "Cheap gaming", "Only projecting 2D movies", "Recording audio podcasts"], a: 0, e: "Apple focuses on high-end 'Spatial Computing', blending digital apps into the physical workspace." },
            { q: "What does 'Passthrough AR' mean?", options: ["Using high-res color cameras on an enclosed VR headset to show the real world and overlaying digital objects on that video feed", "Looking through a clear glass window", "Passing the headset to a friend", "A type of screen protector"], a: 0, e: "Passthrough AR uses screens instead of transparent glass to display the real world." },
            { q: "What is 'Eye Tracking' used for in modern XR headsets?", options: ["Foveated rendering and intuitive UI selection", "Spying on users", "Measuring screen brightness", "Tracking physical steps"], a: 0, e: "Eye tracking knows exactly where you look, allowing menus to react to your gaze." },
            { q: "What is 'Foveated Rendering'?", options: ["Rendering the exact spot the user is looking at in high resolution, and the peripheral vision in lower resolution to save GPU power", "Rendering the whole screen at low quality", "A way to render audio", "Rendering only black and white"], a: 0, e: "Foveated rendering mimics the human eye, drastically reducing processing loads." },
            { q: "How is 'Hand Tracking' achieved without physical controllers?", options: ["Using inward and outward-facing cameras to detect and track the joints of the user's bare hands", "Using a mouse", "Voice recognition", "Foot pedals"], a: 0, e: "Computer vision algorithms map the articulation of hands for controller-free input." },
            { q: "What is a 'Haptic Vest'?", options: ["A wearable device that uses vibration motors to let users physically feel impacts or touch in VR", "A vest that cools the player down", "A bulletproof vest", "A vest that acts as a battery"], a: 0, e: "Haptics increase immersion by mapping in-game events to physical sensations on the body." },
            { q: "Which human sense is currently the most difficult and expensive to simulate convincingly in VR?", options: ["Touch/Force Feedback", "Sight", "Hearing", "Smell"], a: 0, e: "Stopping a user's physical hand from moving through a virtual table requires massive robotic exoskeletons." },
            { q: "What does 'Spatial Audio' mimic?", options: ["How human ears perceive sounds originating from specific distances and 3D directions in the real world", "A radio broadcast", "Underwater sounds", "A flat stereo track"], a: 0, e: "Spatial audio adjusts volume and delay to trick the brain into hearing a sound exactly where a virtual object is." },
            { q: "What is a 'Brain-Computer Interface' (BCI) in relation to XR?", options: ["Technology that allows users to control XR environments or interact directly using brainwave signals", "A smart keyboard", "A psychology test", "A type of AI chatbot"], a: 0, e: "BCIs aim to let users navigate AR menus just by thinking." },
            { q: "What does the 'Holographic Processing Unit' (HPU) do in the HoloLens?", options: ["It is a custom coprocessor designed to handle the massive sensor data of SLAM efficiently", "A graphics card for PC", "A new type of RAM", "A quantum computer"], a: 0, e: "The HPU offloads spatial mapping work from the CPU, keeping the headset running smoothly." },
            { q: "What is the function of a VR 'Controller'?", options: ["A handheld physical device that translates hand movements and button presses into the virtual world", "The main processor", "The strap that holds the headset", "The charging cable"], a: 0, e: "Controllers provide precise physical inputs and haptic feedback." },
            { q: "What is a 'Digital Guardian' or 'Chaperone' system?", options: ["A virtual grid that appears when a user gets too close to a physical wall or obstacle to prevent injury", "A parental control lock", "An AI assistant", "An antivirus software"], a: 0, e: "Safety boundaries are vital for room-scale VR to prevent physical collisions." },
            { q: "What is the primary function of Google Cardboard?", options: ["To provide a highly affordable, entry-level 3 DoF VR experience by using a smartphone as the screen", "To store items", "To act as an AR glass", "To charge phones"], a: 0, e: "Google Cardboard democratized VR by turning smartphones into basic headsets." },
            { q: "Why is tracking 'Six Degrees of Freedom' (6DoF) computationally expensive?", options: ["It requires constant real-time processing of camera feeds and sensor data to map the environment perfectly", "It requires tracking the internet speed", "It downloads huge files", "It drains the battery via Bluetooth"], a: 0, e: "Running SLAM algorithms at 90+ FPS requires immense mathematical processing." },
            { q: "What represents a major engineering barrier to widespread AR glasses adoption?", options: ["The tradeoff between battery life, processing power, heat dissipation, and a lightweight form factor", "They are too cheap", "They have too many games", "They are too easy to use"], a: 0, e: "Packing computer-level power into normal-looking glasses without them overheating or dying in 10 minutes is incredibly hard." },
            { q: "What is 'Anti-aliasing' used for in XR graphics?", options: ["To smooth out the jagged, 'stair-step' edges of 3D objects, improving visual realism", "To speed up rendering", "To change the lighting", "To add sound effects"], a: 0, e: "Because screens are close to the eyes, jagged pixels are very distracting. Anti-aliasing softens these edges." },

            { q: "What does 'Field of Regard' mean?", options: ["The total area a user can view by turning their head and body (360 degrees in VR)", "How much you respect the technology", "The screen size", "The camera resolution"], a: 0, e: "While FOV is what you see at one moment, Field of Regard is the total available environment." },

            { q: "What is a 'Material' in 3D computer graphics?", options: ["A file that dictates how light interacts with a 3D surface (e.g., making it shiny, metallic, or matte)", "The physical plastic of the headset", "The code that runs the game", "A 2D image"], a: 0, e: "Materials define visual properties like roughness and metallicity." },

            { q: "What does a 'Physics Engine' do?", options: ["Simulates real-world physical laws like gravity, collisions, and friction for virtual objects", "Handles the internet connection", "Compresses image files", "Generates sound effects"], a: 0, e: "The physics engine ensures that when you drop a virtual ball, it falls and bounces realistically." },
            { q: "What is the primary function of a 'Collider'?", options: ["To define the physical boundaries of an object so it can bump into other objects", "To make objects visible", "To change colors", "To load levels"], a: 0, e: "Without colliders, virtual hands or objects would just pass right through each other like ghosts." },

            { q: "In Unity, what is a 'Prefab'?", options: ["A reusable, pre-configured game object that can be duplicated instantly", "A pre-recorded video", "A user manual", "A type of script"], a: 0, e: "Prefabs save time by allowing developers to create a complex object once and spawn it many times." },

            { q: "What is the primary benefit of Cloud Rendering for XR?", options: ["It offloads heavy graphical processing to remote servers, allowing thin glasses to display ultra-realistic graphics", "It uses less data", "It works without the internet", "It improves battery life offline"], a: 0, e: "Cloud XR acts like Netflix, streaming interactive 3D computing directly to the headset." }
        ];

        let currentIdx = 0, score = 0, answered = false;

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            const totalQuestions = questions.length;
            document.getElementById('progress-text').innerText = `Question 1/${totalQuestions}`;
            document.getElementById('final-total').innerText = `Correct out of ${totalQuestions}`;
            
            // Randomize options for each question initially
            questions.forEach(q => {
                const originalCorrect = q.options[q.a];
                
                // Fisher-Yates shuffle for options
                for (let i = q.options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
                }
                
                // Find new index of the correct answer
                q.a = q.options.indexOf(originalCorrect);
            });

            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            const totalQuestions = questions.length;
            
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('progress-text').innerText = `Question ${currentIdx + 1}/${totalQuestions}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / totalQuestions) * 100}%`;
            
            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            q.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-2xl border-2 border-slate-100 hover:border-emerald-200 hover:bg-emerald-50 font-medium text-sm text-slate-700 transition-all";
                btn.innerText = opt;
                btn.onclick = () => selectOption(i, btn);
                container.appendChild(btn);
            });
            
            document.getElementById('explanation-box').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            answered = false;
        }

        function selectOption(idx, btn) {
            if (answered) return;
            answered = true;
            
            const q = questions[currentIdx];
            const allBtns = document.querySelectorAll('#options-container button');
            
            if (idx === q.a) {
                score++;
                btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
                document.getElementById('score-text').innerText = `Score: ${score}`;
            } else {
                btn.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                allBtns[q.a].classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-700');
            }
            
            const exp = document.getElementById('explanation-box');
            exp.innerHTML = `<strong>Explanation:</strong> ${q.e}`;
            exp.classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = score;
            }
        }
    </script>
